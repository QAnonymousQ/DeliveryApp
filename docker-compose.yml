services:
  backend:
    build: ./backend
    container_name: delivery-backend
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: "Data Source=/data/delivery.db"
    volumes:
      - delivery-sqlite:/data

  frontend:
    build: ./frontend
    container_name: delivery-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  delivery-sqlite: